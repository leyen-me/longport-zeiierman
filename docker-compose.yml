services:
  ztp-live:
    build: .
    container_name: ztp-live
    environment:
      - LONGPORT_APP_KEY=${LONGPORT_APP_KEY:-}
      - LONGPORT_APP_SECRET=${LONGPORT_APP_SECRET:-}
      - LONGPORT_ACCESS_TOKEN=${LONGPORT_ACCESS_TOKEN:-}
      - LONGPORT_HTTP_URL=${LONGPORT_HTTP_URL:-}
      - TZ=UTC
    volumes:
      - ./data_cache:/app/data_cache
      - ./results:/app/results
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
