[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ztp"
version = "0.1.0"
description = "Zeiierman Trend Pressure (ZTP) 策略复刻: TradingView 精确回测 + 长桥 0DTE 期权实盘"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "longport==4.3.7",
    "tzdata>=2024.1",
]

[tool.setuptools]
packages = ["ztp"]
